[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dddorm"
version = "0.1.0"
description = "An inspection-only exploration of aggregate consistency with SQLAlchemy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy[asyncio]>=2.0,<3", "pydantic>=2,<3"]

[project.optional-dependencies]
examples = ["aiosqlite>=0.19"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dddorm = ["py.typed"]
